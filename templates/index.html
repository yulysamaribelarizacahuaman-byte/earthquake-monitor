<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Earthquake Monitor</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

  <header>
    <h1>Earthquake Monitor</h1>
    <p class="subtitle">Sismos recientes en Sudamérica — datos en vivo del USGS</p>
  </header>

  <section class="stats" id="stats">
    <!-- El JS llena esto con las estadísticas -->
  </section>

  <main>
    <table id="tabla-sismos">
      <thead>
        <tr>
          <th>Magnitud</th>
          <th>Ubicación</th>
          <th>Fecha</th>
        </tr>
      </thead>
      <tbody id="cuerpo-tabla">
        <!-- El JS llena esto con los sismos -->
      </tbody>
    </table>
  </main>

  <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
